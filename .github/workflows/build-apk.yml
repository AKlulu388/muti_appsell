name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          test -f index.html || (echo "仓库根目录缺少 index.html" && exit 1)
          mkdir -p app/src/main/assets app/src/main/java/com/moti/app
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MotiApp"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.moti.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.moti.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName "1.4"
              }
              signingConfigs {
                  moti {
                      storeFile file("../moti.keystore")
                      storePassword "moti2026"
                      keyAlias "moti"
                      keyPassword "moti2026"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.moti }
                  release { signingConfig signingConfigs.moti }
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <application android:label="母题题库" android:allowBackup="true" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/moti/app/MainActivity.java <<'EOF'
          package com.moti.app;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private void toast(final String s) {
                  runOnUiThread(new Runnable() { public void run() { Toast.makeText(MainActivity.this, s, Toast.LENGTH_LONG).show(); } });
              }
              public class FileSaver {
                  @JavascriptInterface public void saveFile(String name, String base64) {
                      try {
                          byte[] data = Base64.decode(base64, Base64.DEFAULT);
                          String safe = name.replace("/", "_").replace("\\", "_").replace(":", "_").replace("*", "_").replace("?", "_").replace("\"", "_").replace("<", "_").replace(">", "_").replace("|", "_");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues cv = new ContentValues();
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                              cv.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream");
                              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                              if (uri == null) { toast("保存失败：无法创建文件"); return; }
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              os.write(data); os.close();
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              dir.mkdirs();
                              File f = new File(dir, safe);
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(data); fos.close();
                          }
                          toast("已保存到 下载/" + safe);
                      } catch (Exception e) { toast("保存失败：" + e.getMessage()); }
                  }
                  @JavascriptInterface public String getDeviceId() {
                      try {
                          String id = android.provider.Settings.Secure.getString(getContentResolver(), android.provider.Settings.Secure.ANDROID_ID);
                          return id == null ? "" : id;
                      } catch (Exception e) { return ""; }
                  }
              }
              public class TrialStore {
                  private static final String PNG_B64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==";
                  private long parseTs(String name) {
                      try {
                          if (name == null || !name.startsWith("MT") || !name.endsWith(".png")) return -1;
                          int u = name.indexOf('_');
                          if (u < 0) return -1;
                          return Long.parseLong(name.substring(u + 1, name.length() - 4), 36);
                      } catch (Exception e) { return -1; }
                  }
                  @JavascriptInterface public String readMarker() {
                      long best = -1;
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              Cursor c = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  new String[]{MediaStore.Images.Media.DISPLAY_NAME},
                                  MediaStore.Images.Media.DISPLAY_NAME + " LIKE ?", new String[]{"MT%"}, null);
                              if (c != null) {
                                  while (c.moveToNext()) {
                                      long t = parseTs(c.getString(0));
                                      if (t > 1600000000000L && (best < 0 || t < best)) best = t;
                                  }
                                  c.close();
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                              File[] fs = dir.listFiles();
                              if (fs != null) for (File f : fs) {
                                  long t = parseTs(f.getName());
                                  if (t > 1600000000000L && (best < 0 || t < best)) best = t;
                              }
                          }
                      } catch (Exception e) { }
                      return best < 0 ? "" : String.valueOf(best);
                  }
                  @JavascriptInterface public void writeMarker(String devId, String ts) {
                      try {
                          long t = Long.parseLong(ts);
                          String name = "MT" + devId + "_" + Long.toString(t, 36) + ".png";
                          byte[] png = Base64.decode(PNG_B64, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues cv = new ContentValues();
                              cv.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                              cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
                              cv.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES);
                              Uri uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                              if (uri == null) return;
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              os.write(png); os.close();
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                              dir.mkdirs();
                              File f = new File(dir, name);
                              if (f.exists()) return;
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(png); fos.close();
                          }
                      } catch (Exception e) { }
                  }
              }
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{android.Manifest.permission.READ_MEDIA_IMAGES}, 3);
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      requestPermissions(new String[]{android.Manifest.permission.READ_EXTERNAL_STORAGE}, 3);
                  } else {
                      requestPermissions(new String[]{android.Manifest.permission.WRITE_EXTERNAL_STORAGE, android.Manifest.permission.READ_EXTERNAL_STORAGE}, 2);
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new FileSaver(), "Android");
              web.addJavascriptInterface(new TrialStore(), "AndroidTrial");
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(Intent.createChooser(i, "选择文件"), 1);
                          return true;
                      }
                      @Override public boolean onJsConfirm(WebView v, String url, String msg, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                              .setPositiveButton("确定", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface d, int w) { result.confirm(); } })
                              .setNegativeButton("取消", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface d, int w) { result.cancel(); } })
                              .setOnCancelListener(new DialogInterface.OnCancelListener() {
                                  public void onCancel(DialogInterface d) { result.cancel(); } })
                              .show();
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 1 && filePathCallback != null) {
                      Uri[] r = (res == RESULT_OK && data != null && data.getData() != null) ? new Uri[]{data.getData()} : null;
                      filePathCallback.onReceiveValue(r);
                      filePathCallback = null;
                  }
              }
              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Restore signing key
        run: echo "" | base64 -d > moti.keystore

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moti-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
